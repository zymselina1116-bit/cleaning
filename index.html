<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hozy-Style 3D Cleaning Room</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="canvas-container"></div>
    <div id="info">
        <h2>Phase 1: Clean the Trash</h2>
        <p>Click and drag trash to the bin!</p>
    </div>

    <!-- Tool Selection UI (hidden initially) -->
    <div id="tool-ui">
        <button class="tool-button" onclick="selectTool('Mop')">
            <div class="tool-icon mop-icon">🧹</div>
            <span>Mop</span>
        </button>
        <button class="tool-button" onclick="selectTool('Sponge')">
            <div class="tool-icon sponge-icon">🧽</div>
            <span>Sponge</span>
        </button>
        <button class="tool-button" onclick="selectTool('Brush')">
            <div class="tool-icon brush-icon">🪥</div>
            <span>Brush</span>
        </button>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script type="module" src="script.js"></script>
</body>
</html>
